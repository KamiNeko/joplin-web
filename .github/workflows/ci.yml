name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: joplin-web:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name joplin-web -p 3001:3001 -e JOPLIN_SERVER_URL=http://127.0.0.1:9 joplin-web:ci
          # Wait for the image's own HEALTHCHECK to report healthy
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' joplin-web)
            [ "$status" = healthy ] && break
            sleep 1
          done
          if [ "$status" != healthy ]; then
            echo "Container is $status"
            docker logs joplin-web
            exit 1
          fi
          health=$(curl -fsS http://localhost:3001/api/health)
          echo "$health"
          echo "$health" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .version == "dev" and .commit == $sha'
          # The bundled client must be served too
          curl -fsS http://localhost:3001/ | grep -q '<div id="root">'
          # The runtime image ships node only
          if docker run --rm --entrypoint sh joplin-web:ci -c 'command -v npm'; then
            echo "npm is still present in the runtime image"
            exit 1
          fi
