services:
  joplin-web:
    container_name: joplin-web
    # Builds from this checkout. Once a release is published you can use the prebuilt image
    # instead: comment out `build:` and uncomment `image:` (pin a version, not `latest`).
    # image: ghcr.io/kamineko/joplin-web:1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Every variable from .env (JOPLIN_SERVER_URL, CORS_ORIGIN, CACHE_TTL_MS, ...) is passed in
    env_file: .env
    environment:
      NODE_ENV: production
      # The container always listens on 3001; HOST_PORT only changes the published port
      PORT: "3001"
    ports:
      - "${HOST_PORT:-3001}:3001"
    restart: unless-stopped
    # Healthcheck is defined in docker/Dockerfile (GET /api/health)
