services:
  joplin-web:
    container_name: joplin-web
    # Builds from this checkout. To use the prebuilt image instead, comment out `build:` and
    # uncomment `image:` (pin a version, not `latest`).
    # image: ghcr.io/kamineko/joplin-web:1.0.1
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Every variable from .env (CORS_ORIGIN, CACHE_TTL_MS, ...) is passed in, if the file exists
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      # The container always listens on 3001; HOST_PORT only changes the published port
      PORT: "3001"
      JOPLIN_SERVER_URL: ${JOPLIN_SERVER_URL:?set JOPLIN_SERVER_URL in .env}
    ports:
      # PORT is still honoured as the host port for one release cycle (deprecated, use HOST_PORT)
      - "${HOST_PORT:-${PORT:-3001}}:3001"
    restart: unless-stopped
    # Healthcheck is defined in docker/Dockerfile (GET /api/health)
