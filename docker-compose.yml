services:
  joplin-web:
    container_name: joplin-web
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - JOPLIN_SERVER_URL=${JOPLIN_SERVER_URL}
      - PORT=${PORT:-3001}
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - ALLOW_REMOTE_IMAGES=${ALLOW_REMOTE_IMAGES:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
