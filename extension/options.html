<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clip to Joplin Web — Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-body">
    <main class="options-card">
      <div class="brand" style="margin-bottom: 16px;">
        <img src="icons/icon32.png" alt="" />
        <span>Clip to Joplin Web — Settings</span>
      </div>

      <form id="options-form" class="content" style="padding: 0;">
        <div class="field">
          <label for="server-url">Joplin Web Server URL</label>
          <input
            id="server-url"
            type="url"
            required
            placeholder="https://notes.example.com"
            autocomplete="url"
          />
          <span class="muted">
            The address where you open Joplin Web in this browser. Sign in there first; the extension reuses your existing browser session and never stores your password.
          </span>
        </div>

        <div class="btn-row">
          <button type="submit" id="save-btn" class="btn btn-primary">Save</button>
          <button type="button" id="test-btn" class="btn btn-secondary">Test connection</button>
        </div>

        <div id="status-banner" class="banner hidden" role="status"></div>

        <hr style="border: none; border-top: 1px solid var(--border); margin: 8px 0;" />

        <div class="field">
          <span class="section-label">Server configuration</span>
          <span class="muted">
            Allow this extension on your Joplin Web server by setting the environment variable below:
          </span>
          <div class="code-row">
            <code id="env-snippet"></code>
            <button type="button" id="copy-env-btn" class="btn btn-secondary" style="padding: 5px 10px; font-size: 12px;">Copy</button>
          </div>
        </div>
      </form>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
